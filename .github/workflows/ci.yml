name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Unit tests cover pure logic (router, CRAG, utils), so they only need
      # these packages, not the full ML stack in requirements.txt.
      - name: Install test dependencies
        run: pip install pandas json5 rich pyyaml python-dotenv pytest

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build
